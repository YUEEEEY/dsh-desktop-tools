# Build the Rust desktop host for Windows / macOS / Linux
# and place each binary under desktop/<platform>-<arch>/ (shipped inside the npm plugin).
#
# Run on: pushes to main, manual dispatch.
name: Build desktop hosts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Build host (release)
        working-directory: host
        run: cargo build --release

      - name: Package binary into plugin dir
        shell: bash
        run: |
          set -e
          mkdir -p "desktop/${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "host/target/release/dsh-desktop.exe" "desktop/${{ matrix.target }}/dsh-desktop.exe"
          else
            cp "host/target/release/dsh-desktop" "desktop/${{ matrix.target }}/dsh-desktop"
          fi
          ls -la "desktop/${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: desktop/${{ matrix.target }}
          if-no-files-found: error

  # Collect all platform binaries into one npm package (desktop/<platform>-<arch>/...)
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all host artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble desktop dir
        shell: bash
        run: |
          set -e
          for dir in artifacts/host-*; do
            name="$(basename "$dir" | sed 's/^host-//')"
            mkdir -p "desktop/$name"
            cp -R "$dir/." "desktop/$name/"
          done
          echo "=== desktop/ contents ==="
          find desktop -type f -exec ls -la {} \;

      - name: npm pack (plugin tarball with all host binaries)
        run: npm pack --registry https://registry.npmjs.org

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dsh-desktop-tools-*.tgz
          if-no-files-found: error
